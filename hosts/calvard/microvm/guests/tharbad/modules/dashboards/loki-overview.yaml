kind: Dashboard
metadata:
  name: loki-overview
  project: monitoring
spec:
  display:
    name: Loki Overview
  panels:
    ingestion_rate:
      kind: Panel
      spec:
        display:
          name: Log Lines Ingested / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum(rate(loki_distributor_lines_received_total[$__rate_interval]))
                  seriesNameFormat: "Lines/sec"
    ingestion_bytes:
      kind: Panel
      spec:
        display:
          name: Ingestion Rate (bytes)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes/sec
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum(rate(loki_distributor_bytes_received_total[$__rate_interval]))
                  seriesNameFormat: "Bytes/sec"
    active_streams:
      kind: Panel
      spec:
        display:
          name: Active Streams
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: loki_ingester_streams_created_total - loki_ingester_streams_removed_total
                  seriesNameFormat: "Streams"
    chunks_stored:
      kind: Panel
      spec:
        display:
          name: Chunks Stored / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum(rate(loki_ingester_chunks_stored_total[$__rate_interval]))
                  seriesNameFormat: "Chunks/sec"
    query_latency:
      kind: Panel
      spec:
        display:
          name: Query Latency (p99)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: histogram_quantile(0.99, sum(rate(loki_request_duration_seconds_bucket{route=~"loki_api_v1_query.*"}[$__rate_interval])) by (le))
                  seriesNameFormat: "p99 query"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: histogram_quantile(0.50, sum(rate(loki_request_duration_seconds_bucket{route=~"loki_api_v1_query.*"}[$__rate_interval])) by (le))
                  seriesNameFormat: "p50 query"
    push_latency:
      kind: Panel
      spec:
        display:
          name: Push Latency (p99)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: histogram_quantile(0.99, sum(rate(loki_request_duration_seconds_bucket{route="loki_api_v1_push"}[$__rate_interval])) by (le))
                  seriesNameFormat: "p99 push"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: histogram_quantile(0.50, sum(rate(loki_request_duration_seconds_bucket{route="loki_api_v1_push"}[$__rate_interval])) by (le))
                  seriesNameFormat: "p50 push"
    request_errors:
      kind: Panel
      spec:
        display:
          name: Request Errors / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum by (route, status_code) (rate(loki_request_duration_seconds_count{status_code=~"5.."}[$__rate_interval]))
                  seriesNameFormat: "{{route}} {{status_code}}"
    memory_usage:
      kind: Panel
      spec:
        display:
          name: Loki Memory
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: process_resident_memory_bytes{job="loki"}
                  seriesNameFormat: "RSS"
  layouts:
    - kind: Grid
      spec:
        display:
          title: Ingestion
        items:
          - x: 0
            "y": 0
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/ingestion_rate"
          - x: 8
            "y": 0
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/ingestion_bytes"
          - x: 16
            "y": 0
            width: 4
            height: 8
            content:
              $ref: "#/spec/panels/active_streams"
          - x: 20
            "y": 0
            width: 4
            height: 8
            content:
              $ref: "#/spec/panels/chunks_stored"
    - kind: Grid
      spec:
        display:
          title: Performance
        items:
          - x: 0
            "y": 0
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/query_latency"
          - x: 8
            "y": 0
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/push_latency"
          - x: 16
            "y": 0
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/request_errors"
    - kind: Grid
      spec:
        display:
          title: Resources
        items:
          - x: 0
            "y": 0
            width: 24
            height: 8
            content:
              $ref: "#/spec/panels/memory_usage"
  duration: 1h
