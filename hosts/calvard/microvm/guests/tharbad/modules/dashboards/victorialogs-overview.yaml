kind: Dashboard
metadata:
  name: victorialogs-overview
  project: monitoring
spec:
  display:
    name: VictoriaLogs Overview
  panels:
    ingestion_rate:
      kind: Panel
      spec:
        display:
          name: Rows Ingested / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum by (type) (rate(vl_rows_ingested_total[$__rate_interval]))
                  seriesNameFormat: "{{type}}"
    ingestion_bytes:
      kind: Panel
      spec:
        display:
          name: Bytes Ingested / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum by (type) (rate(vl_bytes_ingested_total[$__rate_interval]))
                  seriesNameFormat: "{{type}}"
    rows_total:
      kind: Panel
      spec:
        display:
          name: Rows Stored
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: vlstorage_rows
                  seriesNameFormat: "rows"
    storage_size:
      kind: Panel
      spec:
        display:
          name: Storage Size
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: vlstorage_data_size_bytes
                  seriesNameFormat: "size"
    hosts_shipping:
      kind: Panel
      spec:
        display:
          name: Hosts Shipping Logs (last 5m)
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
            thresholds:
              mode: absolute
              defaultColor: red
              steps:
                - value: 10
                  color: orange
                - value: 18
                  color: green
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: count(count by (host) (node_uname_info))
                  seriesNameFormat: "hosts"
    http_request_rate:
      kind: Panel
      spec:
        display:
          name: HTTP Requests / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum by (path) (rate(vl_http_requests_total[$__rate_interval]))
                  seriesNameFormat: "{{path}}"
    http_request_errors:
      kind: Panel
      spec:
        display:
          name: HTTP Request Errors / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 0.01
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum by (path) (rate(vl_http_request_errors_total[$__rate_interval]))
                  seriesNameFormat: "{{path}}"
  layouts:
    - kind: Grid
      spec:
        display:
          title: Ingestion
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/ingestion_rate"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/ingestion_bytes"
    - kind: Grid
      spec:
        display:
          title: Storage
        items:
          - x: 0
            "y": 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/rows_total"
          - x: 8
            "y": 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/storage_size"
          - x: 16
            "y": 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/hosts_shipping"
    - kind: Grid
      spec:
        display:
          title: HTTP
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/http_request_rate"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/http_request_errors"
  duration: 1h
