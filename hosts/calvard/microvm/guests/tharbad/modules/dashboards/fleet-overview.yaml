kind: Dashboard
metadata:
  name: fleet-overview
  project: monitoring
spec:
  display:
    name: Fleet Overview
  panels:
    hosts_up:
      kind: Panel
      spec:
        display:
          name: Hosts Up
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 0
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: count(time() - timestamp(node_uname_info) < 120)
                  seriesNameFormat: "Up"
    hosts_total:
      kind: Panel
      spec:
        display:
          name: Hosts Total
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: count(node_uname_info)
                  seriesNameFormat: "Total"
    alerts_firing:
      kind: Panel
      spec:
        display:
          name: Alerts Firing
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 1
                  color: orange
                - value: 3
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: sum(ALERTS{alertstate="firing"}) or vector(0)
                  seriesNameFormat: "Firing"
    fleet_status:
      kind: Panel
      spec:
        display:
          name: Liveness (seconds since last metrics)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: seconds
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 60
                  color: orange
                - value: 120
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: time() - timestamp(node_uname_info)
                  seriesNameFormat: "{{host}}"
    fleet_cpu:
      kind: Panel
      spec:
        display:
          name: CPU Usage by Host
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: percent-decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: >-
                    1 - avg by (host) (
                      rate(node_cpu_seconds_total{mode="idle"}[$__rate_interval])
                    )
                  seriesNameFormat: "{{host}}"
    fleet_memory:
      kind: Panel
      spec:
        display:
          name: Memory % by Host
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: percent
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 80
                  color: orange
                - value: 90
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: >-
                    100 * (1 - node_memory_MemAvailable_bytes
                    / node_memory_MemTotal_bytes)
                  seriesNameFormat: "{{host}}"
    fleet_disk:
      kind: Panel
      spec:
        display:
          name: Max Filesystem Usage by Host
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: percent-decimal
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 0.8
                  color: orange
                - value: 0.9
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: >-
                    max by (host) (
                      1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                      / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
                    )
                  seriesNameFormat: "{{host}}"
    fleet_uptime:
      kind: Panel
      spec:
        display:
          name: Uptime by Host
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: node_time_seconds - node_boot_time_seconds
                  seriesNameFormat: "{{host}}"
    fleet_load:
      kind: Panel
      spec:
        display:
          name: Load Average (1m) by Host
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: node_load1
                  seriesNameFormat: "{{host}}"
    alerts_by_host:
      kind: Panel
      spec:
        display:
          name: Active Alerts by Host
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: count by (host) (ALERTS{alertstate="firing"})
                  seriesNameFormat: "{{host}}"
  layouts:
    - kind: Grid
      spec:
        display:
          title: At a Glance
        items:
          - x: 0
            "y": 0
            width: 4
            height: 6
            content:
              $ref: "#/spec/panels/hosts_up"
          - x: 4
            "y": 0
            width: 4
            height: 6
            content:
              $ref: "#/spec/panels/hosts_total"
          - x: 8
            "y": 0
            width: 4
            height: 6
            content:
              $ref: "#/spec/panels/alerts_firing"
          - x: 12
            "y": 0
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/fleet_status"
    - kind: Grid
      spec:
        display:
          title: Resource Usage
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/fleet_cpu"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/fleet_memory"
          - x: 0
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/fleet_disk"
          - x: 12
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/fleet_load"
    - kind: Grid
      spec:
        display:
          title: Alerts & Uptime
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/alerts_by_host"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/fleet_uptime"
  duration: 1h
