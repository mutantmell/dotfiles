kind: Dashboard
metadata:
  name: alertmanager-overview
  project: monitoring
spec:
  display:
    name: Alertmanager Overview
  panels:
    firing_alerts:
      kind: Panel
      spec:
        display:
          name: Firing Alerts
        plugin:
          kind: Table
          spec:
            density: compact
            defaultColumnHidden: true
            pagination: false
            enableFiltering: true
            columnSettings:
              - name: alertname
                header: Alert
                hide: false
                width: 240
                enableSorting: true
                sort: asc
              - name: severity
                header: Severity
                hide: false
                width: 100
                enableSorting: true
              - name: host
                header: Host
                hide: false
                width: 140
                enableSorting: true
              - name: mountpoint
                header: Mountpoint
                hide: false
                width: 200
              - name: name
                header: Unit
                hide: false
                width: 220
              - name: zpool
                header: ZFS Pool
                hide: false
                width: 120
              - name: status_code
                header: Status
                hide: false
                width: 100
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: ALERTS{alertstate="firing"}
    alertmanager_link:
      kind: Panel
      spec:
        display:
          name: Open in Alertmanager
        plugin:
          kind: Markdown
          spec:
            text: |
              ### Alertmanager UI

              [Open Alertmanager](http://tharbad.internal:9093/#/alerts) for full
              alert details (annotation text, group keys, silences, routing).

              - **Active**: `/#/alerts`
              - **Silences**: `/#/silences`
              - **Status / config**: `/#/status`
    active_alerts:
      kind: Panel
      spec:
        display:
          name: Active Alerts
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 1
                  color: orange
                - value: 3
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: alertmanager_alerts{state="active"}
                  seriesNameFormat: "Active"
    suppressed_alerts:
      kind: Panel
      spec:
        display:
          name: Suppressed Alerts
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: alertmanager_alerts{state="suppressed"}
                  seriesNameFormat: "Suppressed"
    alerts_over_time:
      kind: Panel
      spec:
        display:
          name: Alerts Over Time
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: alertmanager_alerts{state="active"}
                  seriesNameFormat: "Active"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: alertmanager_alerts{state="suppressed"}
                  seriesNameFormat: "Suppressed"
    notification_rate:
      kind: Panel
      spec:
        display:
          name: Notifications Sent / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: rate(alertmanager_notifications_total[$__rate_interval])
                  seriesNameFormat: "{{integration}}"
    notification_failures:
      kind: Panel
      spec:
        display:
          name: Notification Failures / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 0.01
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: rate(alertmanager_notifications_failed_total[$__rate_interval])
                  seriesNameFormat: "{{integration}}"
    notification_latency:
      kind: Panel
      spec:
        display:
          name: Notification Latency (p99)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: histogram_quantile(0.99, rate(alertmanager_notification_latency_seconds_bucket[$__rate_interval]))
                  seriesNameFormat: "p99"
  layouts:
    - kind: Grid
      spec:
        display:
          title: Firing Now
        items:
          - x: 0
            "y": 0
            width: 18
            height: 10
            content:
              $ref: "#/spec/panels/firing_alerts"
          - x: 18
            "y": 0
            width: 6
            height: 10
            content:
              $ref: "#/spec/panels/alertmanager_link"
    - kind: Grid
      spec:
        display:
          title: Alerts
        items:
          - x: 0
            "y": 0
            width: 4
            height: 8
            content:
              $ref: "#/spec/panels/active_alerts"
          - x: 4
            "y": 0
            width: 4
            height: 8
            content:
              $ref: "#/spec/panels/suppressed_alerts"
          - x: 8
            "y": 0
            width: 16
            height: 8
            content:
              $ref: "#/spec/panels/alerts_over_time"
    - kind: Grid
      spec:
        display:
          title: Notifications
        items:
          - x: 0
            "y": 0
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/notification_rate"
          - x: 8
            "y": 0
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/notification_failures"
          - x: 16
            "y": 0
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/notification_latency"
  duration: 1h
