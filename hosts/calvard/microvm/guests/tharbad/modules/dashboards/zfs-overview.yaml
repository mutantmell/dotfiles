kind: Dashboard
metadata:
  name: zfs-overview
  project: monitoring
spec:
  display:
    name: ZFS Overview
  variables:
    - kind: ListVariable
      spec:
        name: host
        display:
          name: Host
          hidden: false
        allowAllValue: true
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: prometheus
            labelName: host
            matchers:
              - zfs_pool_health
  panels:
    pool_health:
      kind: Panel
      spec:
        display:
          name: Pool Health
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 1
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: zfs_pool_health{host=~"$host"}
                  seriesNameFormat: "{{host}} {{pool}}"
    pool_size:
      kind: Panel
      spec:
        display:
          name: Pool Size
        plugin:
          kind: GaugeChart
          spec:
            calculation: last
            format:
              unit: percent-decimal
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 0.8
                  color: orange
                - value: 0.9
                  color: red
            max: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: >-
                    zfs_pool_allocated_bytes{host=~"$host"}
                    / zfs_pool_size_bytes{host=~"$host"}
                  seriesNameFormat: "{{host}} {{pool}}"
    pool_usage:
      kind: Panel
      spec:
        display:
          name: Pool Usage Over Time
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: zfs_pool_allocated_bytes{host=~"$host"}
                  seriesNameFormat: "{{host}} {{pool}} used"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: zfs_pool_free_bytes{host=~"$host"}
                  seriesNameFormat: "{{host}} {{pool}} free"
    pool_fragmentation:
      kind: Panel
      spec:
        display:
          name: Pool Fragmentation
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: zfs_pool_fragmentation_ratio{host=~"$host"}
                  seriesNameFormat: "{{host}} {{pool}}"
    dataset_usage:
      kind: Panel
      spec:
        display:
          name: Dataset Usage
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: zfs_dataset_used_bytes{host=~"$host", type="filesystem"}
                  seriesNameFormat: "{{host}} {{name}}"
    disk_temperature:
      kind: Panel
      spec:
        display:
          name: Disk Temperature
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: celsius
            thresholds:
              steps:
                - value: 45
                  color: orange
                - value: 55
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: smartctl_device_temperature{host=~"$host"}
                  seriesNameFormat: "{{host}} {{device}} ({{model_name}})"
    disk_health:
      kind: Panel
      spec:
        display:
          name: SMART Health
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
            thresholds:
              mode: absolute
              defaultColor: red
              steps:
                - value: 1
                  color: green
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: smartctl_device_smart_status{host=~"$host"}
                  seriesNameFormat: "{{host}} {{device}}"
    disk_power_on:
      kind: Panel
      spec:
        display:
          name: Power-On Hours
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: smartctl_device_power_on_seconds{host=~"$host"} / 3600
                  seriesNameFormat: "{{host}} {{device}}"
  layouts:
    - kind: Grid
      spec:
        display:
          title: ZFS Pools
        items:
          - x: 0
            "y": 0
            width: 6
            height: 8
            content:
              $ref: "#/spec/panels/pool_health"
          - x: 6
            "y": 0
            width: 6
            height: 8
            content:
              $ref: "#/spec/panels/pool_size"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/pool_usage"
          - x: 0
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/pool_fragmentation"
          - x: 12
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/dataset_usage"
    - kind: Grid
      spec:
        display:
          title: Disk Health (SMART)
        items:
          - x: 0
            "y": 0
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/disk_health"
          - x: 12
            "y": 0
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/disk_power_on"
          - x: 0
            "y": 6
            width: 24
            height: 10
            content:
              $ref: "#/spec/panels/disk_temperature"
  duration: 6h
