kind: Dashboard
metadata:
  name: log-viewer
  project: monitoring
spec:
  display:
    name: Log Viewer
  variables:
    - kind: ListVariable
      spec:
        name: host
        display:
          name: Host
          hidden: false
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: prometheus
            labelName: nodename
            matchers:
              - node_uname_info
    - kind: TextVariable
      spec:
        name: filter
        display:
          name: Filter
          hidden: false
        value: ""
  panels:
    logs:
      kind: Panel
      spec:
        display:
          name: Logs
        plugin:
          kind: LogsTable
          spec:
            showTime: true
            enableDetails: true
            allowWrap: true
        queries:
          - kind: LogQuery
            spec:
              plugin:
                kind: VictoriaLogsLogQuery
                spec:
                  datasource:
                    kind: VictoriaLogsDatasource
                    name: victorialogs
                  query: 'host:"$host" AND _msg:~"$filter"'
  layouts:
    - kind: Grid
      spec:
        display:
          title: ""
        items:
          - x: 0
            "y": 0
            width: 24
            height: 20
            content:
              $ref: "#/spec/panels/logs"
  duration: 1h
