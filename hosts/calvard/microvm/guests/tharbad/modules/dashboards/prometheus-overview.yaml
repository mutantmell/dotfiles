kind: Dashboard
metadata:
  name: prometheus-overview
  project: monitoring
spec:
  display:
    name: Prometheus Overview
  panels:
    target_health:
      kind: Panel
      spec:
        display:
          name: Target Health
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: up
                  seriesNameFormat: "{{job}} / {{instance}}"
    targets_up:
      kind: Panel
      spec:
        display:
          name: Targets Up
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: count(up == 1)
                  seriesNameFormat: "Up"
    targets_down:
      kind: Panel
      spec:
        display:
          name: Targets Down
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 1
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: count(up == 0) or vector(0)
                  seriesNameFormat: "Down"
    scrape_duration:
      kind: Panel
      spec:
        display:
          name: Scrape Duration
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: scrape_duration_seconds
                  seriesNameFormat: "{{job}} / {{instance}}"
    ingestion_rate:
      kind: Panel
      spec:
        display:
          name: Samples Ingested / sec
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: rate(prometheus_tsdb_head_samples_appended_total[5m])
                  seriesNameFormat: "Samples/sec"
    head_series:
      kind: Panel
      spec:
        display:
          name: Head Series
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: decimal
              shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: prometheus_tsdb_head_series
                  seriesNameFormat: "Series"
    memory_usage:
      kind: Panel
      spec:
        display:
          name: Prometheus Memory
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: process_resident_memory_bytes{job="prometheus"}
                  seriesNameFormat: "RSS"
    tsdb_size:
      kind: Panel
      spec:
        display:
          name: TSDB Size
        plugin:
          kind: StatChart
          spec:
            calculation: last
            format:
              unit: bytes
              shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: prometheus_tsdb_storage_blocks_bytes
                  seriesNameFormat: "Blocks"
  layouts:
    - kind: Grid
      spec:
        display:
          title: Targets
        items:
          - x: 0
            "y": 0
            width: 16
            height: 8
            content:
              $ref: "#/spec/panels/target_health"
          - x: 16
            "y": 0
            width: 4
            height: 8
            content:
              $ref: "#/spec/panels/targets_up"
          - x: 20
            "y": 0
            width: 4
            height: 8
            content:
              $ref: "#/spec/panels/targets_down"
    - kind: Grid
      spec:
        display:
          title: Performance
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/scrape_duration"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/ingestion_rate"
    - kind: Grid
      spec:
        display:
          title: Resources
        items:
          - x: 0
            "y": 0
            width: 4
            height: 8
            content:
              $ref: "#/spec/panels/head_series"
          - x: 4
            "y": 0
            width: 4
            height: 8
            content:
              $ref: "#/spec/panels/tsdb_size"
          - x: 8
            "y": 0
            width: 16
            height: 8
            content:
              $ref: "#/spec/panels/memory_usage"
  duration: 1h
