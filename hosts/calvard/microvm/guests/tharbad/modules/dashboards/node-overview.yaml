kind: Dashboard
metadata:
  name: node-overview
  project: monitoring
spec:
  display:
    name: Node Overview
  variables:
    - kind: ListVariable
      spec:
        name: host
        display:
          name: Host
          hidden: false
        allowAllValue: true
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: prometheus
            labelName: host
            matchers:
              - node_uname_info
  panels:
    cpu_usage:
      kind: Panel
      spec:
        display:
          name: CPU Usage
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: percent-decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: >-
                    clamp_min(1 - avg by (host) (
                      rate(node_cpu_seconds_total{host=~"$host", mode="idle"}[$__rate_interval])
                    ), 0)
                  seriesNameFormat: "{{host}}"
    load_averages:
      kind: Panel
      spec:
        display:
          name: Load Average (1m)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: node_load1{host=~"$host"}
                  seriesNameFormat: "{{host}}"
    memory_usage:
      kind: Panel
      spec:
        display:
          name: Memory Used
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: >-
                    node_memory_MemTotal_bytes{host=~"$host"}
                    - node_memory_MemAvailable_bytes{host=~"$host"}
                  seriesNameFormat: "{{host}}"
    memory_pct:
      kind: Panel
      spec:
        display:
          name: Memory %
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: percent
            thresholds:
              mode: absolute
              defaultColor: green
              steps:
                - value: 80
                  color: orange
                - value: 90
                  color: red
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: >-
                    100 * (1 - node_memory_MemAvailable_bytes{host=~"$host"}
                    / node_memory_MemTotal_bytes{host=~"$host"})
                  seriesNameFormat: "{{host}}"
    disk_io:
      kind: Panel
      spec:
        display:
          name: Disk I/O
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes/sec
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: rate(node_disk_read_bytes_total{host=~"$host", device!=""}[$__rate_interval])
                  seriesNameFormat: "{{host}} {{device}} read"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: rate(node_disk_written_bytes_total{host=~"$host", device!=""}[$__rate_interval])
                  seriesNameFormat: "{{host}} {{device}} write"
    filesystem_usage:
      kind: Panel
      spec:
        display:
          name: Filesystem Usage
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: percent-decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: >-
                    max by (host, device) (
                      1 - node_filesystem_avail_bytes{host=~"$host", fstype!~"tmpfs|overlay"}
                      / node_filesystem_size_bytes{host=~"$host", fstype!~"tmpfs|overlay"}
                    )
                  seriesNameFormat: "{{host}} {{device}}"
    network_receive:
      kind: Panel
      spec:
        display:
          name: Network Received
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes/sec
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: rate(node_network_receive_bytes_total{host=~"$host", device!="lo"}[$__rate_interval])
                  seriesNameFormat: "{{host}} {{device}}"
    network_transmit:
      kind: Panel
      spec:
        display:
          name: Network Transmitted
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last]
            yAxis:
              format:
                unit: bytes/sec
                shortValues: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus
                  query: rate(node_network_transmit_bytes_total{host=~"$host", device!="lo"}[$__rate_interval])
                  seriesNameFormat: "{{host}} {{device}}"
  layouts:
    - kind: Grid
      spec:
        display:
          title: CPU
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/cpu_usage"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/load_averages"
    - kind: Grid
      spec:
        display:
          title: Memory
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/memory_usage"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/memory_pct"
    - kind: Grid
      spec:
        display:
          title: Disk
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/disk_io"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/filesystem_usage"
    - kind: Grid
      spec:
        display:
          title: Network
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/network_receive"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/network_transmit"
  duration: 1h
