      - age:
          - *ad_denai
          - *sv_denai

  # erebonia
  - path_regex: hosts/erebonia/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_erebonia
  - path_regex: hosts/erebonia/microvm/guests/saint-arkh/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_saint-arkh
  - path_regex: hosts/erebonia/incus/guests/trista/secrets/[^/]+\.yaml$
