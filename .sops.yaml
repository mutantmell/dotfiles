          - *sv_creil
  - path_regex: hosts/calvard/incus/guests/edith/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_edith

  # azoth
  - path_regex: hosts/azoth/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_azoth

  # OpenWrt
  - path_regex: hosts/openwrt/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
        # OpenWrt devices don't need keys - secrets are pushed via SSH at deploy time
