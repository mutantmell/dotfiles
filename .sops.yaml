creation_rules:
  # thebeyond
  - path_regex: hosts/thebeyond/microvm/guests/phantasma/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_phantasma
  - path_regex: hosts/thebeyond/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_thebeyond

  # liberl
  - path_regex: hosts/liberl/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_liberl
  - path_regex: hosts/liberl/microvm/guests/bose/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_bose
  - path_regex: hosts/liberl/microvm/guests/zeiss/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_zeiss

  # erebonia
  - path_regex: hosts/erebonia/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_erebonia
  - path_regex: hosts/erebonia/microvm/guests/roer/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_roer
  - path_regex: hosts/erebonia/microvm/guests/saint-arkh/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_saint-arkh
  - path_regex: hosts/erebonia/incus/guests/trista/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_trista

  # calvard
  - path_regex: hosts/calvard/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_calvard
  - path_regex: hosts/calvard/microvm/guests/messeldam/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_messeldam
  - path_regex: hosts/calvard/microvm/guests/basel/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_basel
  - path_regex: hosts/calvard/microvm/guests/langport/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_langport
  - path_regex: hosts/calvard/microvm/guests/tharbad/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_tharbad
  - path_regex: hosts/calvard/microvm/guests/creil/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_creil
  - path_regex: hosts/calvard/incus/guests/edith/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_edith

  # arcus
  - path_regex: hosts/arcus/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_arcus

  # OpenWrt
  - path_regex: hosts/openwrt/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
        # OpenWrt devices don't need keys - secrets are pushed via SSH at deploy time

  # Users
  - path_regex: home/hosts/edith/secrets.yaml
    key_groups:
      - age:
          - *ad_denai
          - *us_edith
