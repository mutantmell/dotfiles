creation_rules:
  # thebeyond
  - path_regex: hosts/thebeyond/microvm/guests/phantasma/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_phantasma
  - path_regex: hosts/thebeyond/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_thebeyond

  # remiferia
  - path_regex: hosts/remiferia/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_remiferia
  - path_regex: hosts/remiferia/microvm/guests/ardent/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *ad_denai
          - *sv_ardent
  - path_regex: hosts/remiferia/microvm/guests/denai/secrets/[^/]+\.yaml$
